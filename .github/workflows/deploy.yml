name: 自动构建并智能部署到虚拟主机

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取最新源码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 pnpm
        run: npm install -g pnpm

      - name: 安装项目依赖
        run: pnpm install

      - name: 构建生成静态文件
        run: pnpm build

      - name: 复制 index.php 到 dist
        run: cp public/index.php dist/

      - name: 通过 lftp 增量上传
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp
          lftp -e "
            set ftp:ssl-allow no;
            open ftp://${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_HOST }};
            mirror --reverse --delete --verbose --parallel=10 --ignore-time --exclude .htaccess ./dist/ /wwwroot/;
            quit;
          "
